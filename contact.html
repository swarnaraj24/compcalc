<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — CompCalc</title>
  <meta name="description" content="Contact the CompCalc team for feedback, bug reports, or calculator requests." />
  <link rel="canonical" href="https://compcalc-a1x.pages.dev/contact.html" />
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
  <header>
    <div class="container nav-wrap">
      <a href="/" class="brand">Comp<span>Calc</span></a>
      <nav>
        <a href="/sales-commission/">Sales Commission</a>
        <a href="/ote-calculator/">OTE Calculator</a>
        <a href="/hourly-to-salary/">Hourly to Salary</a>
        <a href="/margin-markup/">Margin &amp; Markup</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Contact Us</h1>
      <p>Have a question, formula suggestion, or bug report? Send a message below.</p>
    </section>

    <div class="card" style="max-width: 640px; margin-bottom: 44px;">
      <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="29c4997e-03cc-451c-b1fc-ed215c3c6c94" />
        <input type="hidden" name="subject" value="New Message from CompCalc" />
        <input type="checkbox" name="botcheck" style="display: none;" />

        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" required style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:7px; font-size:1rem;" />
        </div>

        <div class="form-group">
          <label for="email">Your Email Address</label>
          <input type="email" id="email" name="email" required style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:7px; font-size:1rem;" />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:7px; font-size:1rem; font-family:inherit;"></textarea>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container footer-wrap">
      <div>&copy; 2026 CompCalc. For estimation and educational purposes only.</div>
      <div class="footer-links">
        <a href="/about.html">About</a>
        <a href="/privacy-policy.html">Privacy Policy</a>
        <a href="/terms.html">Terms</a>
        <a href="/contact.html">Contact</a>
      </div>
    </div>
  </footer>
</body>
</html>
